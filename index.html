<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kaset — retro kamera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Permanent+Marker&family=VT323&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --body-hi:#D6D8DB; --body-lo:#C2C5C9; --ink:#1B1C1E; --muted:#51565C; --hair:#A5A9AE;
  --bezel:#26282C; --rec:#E0301E; --led:#F2A33A; --label:#F4F0E4; --rule:#B3C6E0; --shell:#2B2C30;
  --sheet:#E4E6E9; --chip:#ECEEF0; --focus:#1F5FBF; --scrim:rgba(20,21,24,.42);
  --ease:cubic-bezier(.22,1,.36,1);
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  --marker:"Permanent Marker","Marker Felt","Comic Sans MS",cursive;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --body-hi:#313337; --body-lo:#25272A; --ink:#E8E9EB; --muted:#A5AAB0; --hair:#474A50;
    --bezel:#0F1012; --sheet:#232428; --chip:#303236; --shell:#17181B; --focus:#8DB4FF; --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --body-hi:#313337; --body-lo:#25272A; --ink:#E8E9EB; --muted:#A5AAB0; --hair:#474A50;
  --bezel:#0F1012; --sheet:#232428; --chip:#303236; --shell:#17181B; --focus:#8DB4FF; --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--body-lo);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}

.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding:8px 14px 10px;background:linear-gradient(180deg,var(--body-hi),var(--body-lo));}
@media (min-width:600px){ .app{border-left:1px solid var(--hair);border-right:1px solid var(--hair)} body{background:var(--body-hi)} }

.bar{display:flex;align-items:center;justify-content:space-between;min-height:40px}
.brand{display:flex;align-items:center;gap:10px}
.led{width:8px;height:8px;border-radius:50%;background:var(--led);box-shadow:0 0 0 2px rgba(0,0,0,.14),0 0 8px rgba(242,163,58,.65)}
.is-rec .led{background:var(--rec);box-shadow:0 0 0 2px rgba(0,0,0,.14),0 0 12px rgba(224,48,30,.95)}
.word{font-weight:800;font-variation-settings:"wdth" 125;font-size:23px;letter-spacing:-.015em;line-height:1}
.bar-r{display:flex;align-items:center;gap:8px}
.chip{height:34px;min-width:52px;padding:0 12px;border-radius:17px;background:var(--chip);border:1px solid var(--hair);font-weight:650;font-variation-settings:"wdth" 110;font-size:14px}
.ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--chip);border:1px solid var(--hair)}
.ic svg{width:18px;height:18px}

.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.stage>*{transform:translateY(var(--lift,0px));transition:transform .3s var(--ease)}
.bezel{padding:8px;background:var(--bezel);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 0 rgba(255,255,255,.35),0 10px 24px rgba(0,0,0,.22)}
.lcd{position:relative;width:320px;height:240px;overflow:hidden;background:#000;border-radius:6px}
.lcd canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.osd-over{image-rendering:pixelated;pointer-events:none}
.power{position:absolute;inset:0;background:#000;pointer-events:none;opacity:0}
.power.on{opacity:1;animation:pw-fade .45s .6s forwards}
.power.on::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:#F2F6FF;box-shadow:0 0 14px #CFE0FF;transform:scaleX(0);animation:pw-line .7s .05s var(--ease) forwards}
@keyframes pw-line{0%{transform:scaleX(0) scaleY(1);opacity:1}45%{transform:scaleX(1) scaleY(1);opacity:1}100%{transform:scaleX(1) scaleY(140);opacity:0}}
@keyframes pw-fade{to{opacity:0}}
.msg{width:100%;display:flex;flex-direction:column;gap:8px;padding:0 2px}
.msg p{margin:0;font-size:14px;line-height:1.35;color:var(--muted);max-width:44ch}
.msg-a{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:38px;padding:0 16px;border-radius:19px;font-weight:650;font-size:14px;border:1px solid var(--hair);color:var(--ink);background:transparent}
.btn.primary{background:var(--ink);color:var(--body-hi);border-color:var(--ink)}
.btn.ghost{border-color:transparent;color:var(--muted)}

.tapes{display:flex;gap:10px;padding:2px 2px 0}
.tape{position:relative;flex:1 1 0;min-width:0;height:78px;border-radius:9px;background:var(--shell);padding:6px 6px 0;opacity:.66;transition:transform .2s var(--ease),opacity .2s,box-shadow .2s;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 1px 0 rgba(0,0,0,.25);text-align:left}
.tape[aria-checked="true"]{opacity:1;transform:translateY(-4px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 8px 16px rgba(0,0,0,.28)}
.label{display:block;height:44px;border-radius:4px;padding:3px 7px 0;border-top:6px solid var(--stripe);background:repeating-linear-gradient(to bottom,transparent 0 12px,var(--rule) 12px 13px),var(--label);overflow:hidden}
.marker{display:block;font-family:var(--marker);font-size:15px;line-height:1.25;color:#1D2847;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:rotate(-1.6deg);transform-origin:left center}
.note{display:block;font-size:10.5px;line-height:1.2;color:#5B6070;font-variation-settings:"wdth" 88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reels{display:flex;justify-content:center;gap:24px;margin-top:5px}
.reels i{display:block;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle,#0B0B0D 0 26%,#4A4C52 27% 44%,#0B0B0D 45%);position:relative}
.reels i::after{content:"";position:absolute;left:6.5px;top:1px;width:2px;height:4px;background:#8A8D94;border-radius:1px}
.is-rec .tape[aria-checked="true"] .reels i{animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.deck{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:2px 4px 2px}
.side{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);justify-self:start;min-width:64px}
.side:last-child{justify-self:end}
.disc{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,var(--chip),var(--body-lo));border:1px solid var(--hair);color:var(--ink)}
.disc svg{width:20px;height:20px}
.side:disabled{opacity:.45}
.rec{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#F5F6F7,#B6B9BE);box-shadow:inset 0 1px 0 #fff,0 3px 8px rgba(0,0,0,.28),0 0 0 1px rgba(0,0,0,.12)}
.rec-core{display:block;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 42% 34%,#FF6B57,var(--rec) 58%,#A11B0F);box-shadow:inset 0 -2px 3px rgba(0,0,0,.25);transition:width .2s var(--ease),height .2s var(--ease),border-radius .2s var(--ease)}
.rec[aria-pressed="true"] .rec-core{width:30px;height:30px;border-radius:7px}

.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s;z-index:10}
.scrim.on{opacity:1}
.scrim.clear{background:transparent}
.sheet.peek{max-height:54%}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:80%;overflow:auto;overscroll-behavior:contain;background:var(--sheet);border-radius:18px 18px 0 0;padding:6px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(102%);transition:transform .3s var(--ease);z-index:11;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--hair);margin:4px auto 8px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet h2{margin:0;font-size:21px;font-weight:750;font-variation-settings:"wdth" 112;letter-spacing:-.01em}
.x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--chip);border:1px solid var(--hair)}
.x svg{width:16px;height:16px}
.sheet-sub{margin:6px 0 14px;color:var(--muted);font-size:14px;max-width:46ch}
.amt{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 0 14px;border-bottom:1px solid var(--hair)}
.amt span{font-weight:650}
.amt output{font-variant-numeric:tabular-nums;color:var(--muted);min-width:4ch;text-align:right}
input[type=range]{width:100%;accent-color:var(--rec)}
.lg h3{margin:16px 0 4px;font-size:13px;font-weight:700;color:var(--muted);font-variation-settings:"wdth" 110}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--hair)}
.lrow:last-child{border-bottom:0}
.lt{display:flex;flex-direction:column;min-width:0}
.ln{font-weight:650}
.lw{font-size:13px;color:var(--muted);line-height:1.3}
.lrow.na .ln{color:var(--muted)}
.sw{flex:none;width:46px;height:28px;border-radius:14px;background:var(--hair);position:relative;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s var(--ease)}
.sw[aria-checked="true"]{background:var(--ink)}
.sw[aria-checked="true"] i{transform:translateX(18px)}
.sw:disabled{opacity:.35}
.src-list{display:flex;flex-direction:column;gap:8px;padding:4px 0 6px}
.src-opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border-radius:12px;border:1px solid var(--hair);text-align:left}
.src-opt[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.src-t{font-weight:700}
.src-d{font-size:13px;color:var(--muted)}
#clipVideo{display:block;width:100%;max-height:46vh;background:#000;border-radius:8px}
.clip-a{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(128px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);max-width:min(88vw,420px);padding:10px 16px;border-radius:12px;background:#17181B;color:#F4F5F7;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s var(--ease);z-index:30;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.lcd .feed{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}
.linkbox{flex:1 1 100%;min-width:0;height:38px;border-radius:10px;border:1px solid var(--hair);background:var(--chip);color:var(--ink);padding:0 10px;font:inherit;font-size:13px}
@media (prefers-reduced-motion:reduce){
  .power{display:none}
  .sheet,.scrim,.tape,.rec-core,.sw,.sw i,.toast,.stage>*{transition:none}
  .is-rec .tape[aria-checked="true"] .reels i{animation:none}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <div class="brand"><span class="led" id="led" aria-hidden="true"></span><span class="word">kaset</span></div>
    <div class="bar-r">
      <button class="chip" id="fmtBtn" type="button" aria-label="En-boy oranı 4:3. Dikeye geçmek için dokun.">4:3</button>
      <button class="ic" id="flipBtn" type="button" aria-label="Kamerayı çevir" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>
      </button>
      <button class="ic" id="layersBtn" type="button" aria-label="Katmanlar" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="bezel">
      <div class="lcd" id="lcd">
        <video id="camVideo" class="feed" playsinline muted aria-hidden="true"></video>
        <video id="fileVideo" class="feed" playsinline aria-hidden="true"></video>
        <canvas id="gl" aria-label="Vizör"></canvas>
        <canvas id="osd" class="osd-over" aria-hidden="true" hidden></canvas>
        <div class="power" id="power" aria-hidden="true"></div>
      </div>
    </div>
    <div class="msg" id="msg" role="status">
      <p id="msgText">Demo sahnesi oynuyor. Kendi görüntün için kamerayı aç.</p>
      <div class="msg-a" id="msgActions"></div>
    </div>
  </main>

  <section class="tapes" id="tapes" role="radiogroup" aria-label="Kaset">
    <button class="tape" type="button" role="radio" aria-checked="true" tabindex="0" data-preset="dv" style="--stripe:#3D6FB6">
      <span class="label"><span class="marker">MiniDV ’05</span><span class="note">tarak, hale, smear</span></span>
      <span class="reels" aria-hidden="true"><i></i><i></i></span>
    </button>
    <button class="tape" type="button" role="radio" aria-checked="false" tabindex="-1" data-preset="vhs" style="--stripe:#D9642B">
      <span class="label"><span class="marker">VHS-C ’96</span><span class="note">kanama, titreme</span></span>
      <span class="reels" aria-hidden="true"><i></i><i></i></span>
    </button>
    <button class="tape" type="button" role="radio" aria-checked="false" tabindex="-1" data-preset="cam" style="--stripe:#3F8F5E">
      <span class="label"><span class="marker">Digicam ’03</span><span class="note">15 fps, blok, smear</span></span>
      <span class="reels" aria-hidden="true"><i></i><i></i></span>
    </button>
  </section>

  <footer class="deck">
    <button class="side" id="srcBtn" type="button" aria-haspopup="dialog">
      <span class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6.5" width="13" height="11" rx="2"/><path d="M15.5 10.5l6-3.5v10l-6-3.5"/></svg></span>
      <span>Kaynak</span>
    </button>
    <button class="rec" id="recBtn" type="button" aria-label="Kaydı başlat" aria-pressed="false"><span class="rec-core"></span></button>
    <button class="side" id="clipBtn" type="button" aria-haspopup="dialog" disabled>
      <span class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg></span>
      <span>Klip</span>
    </button>
  </footer>
</div>

<div class="scrim" id="scrim" hidden></div>

<section class="sheet peek" id="layersSheet" role="dialog" aria-modal="true" aria-labelledby="layersTitle" hidden>
  <div class="grab" aria-hidden="true"></div>
  <div class="sheet-h"><h2 id="layersTitle">Katmanlar</h2><button class="x" type="button" data-close aria-label="Kapat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <p class="sheet-sub">Her katman gerçek bir kamera kusuru. Kapatınca ne kattığını görürsün.</p>
  <label class="amt"><span>Yoğunluk</span><input type="range" id="amt" min="0" max="150" step="5" value="100"><output id="amtVal">100%</output></label>
  <div id="layerList"></div>
</section>

<section class="sheet" id="srcSheet" role="dialog" aria-modal="true" aria-labelledby="srcTitle" hidden>
  <div class="grab" aria-hidden="true"></div>
  <div class="sheet-h"><h2 id="srcTitle">Kaynak</h2><button class="x" type="button" data-close aria-label="Kapat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="src-list">
    <button class="src-opt" type="button" data-src="cam"><span class="src-t">Canlı kamera</span><span class="src-d">Vizörde canlı efekt; iOS’ta claude.ai içinde kapalı olabilir</span></button>
    <button class="src-opt" type="button" data-src="shoot"><span class="src-t">Telefonla çek</span><span class="src-d">Kamera uygulaması açılır; klip kasetten geçip kaydedilir</span></button>
    <button class="src-opt" type="button" data-src="file"><span class="src-t">Video dosyası</span><span class="src-d">Galerideki bir klibi kasetten geçirir</span></button>
    <button class="src-opt" type="button" data-src="demo" aria-current="true"><span class="src-t">Demo sahne</span><span class="src-d">İzin istemez; efektleri görmek için</span></button>
  </div>
</section>

<section class="sheet" id="clipSheet" role="dialog" aria-modal="true" aria-labelledby="clipTitle" hidden>
  <div class="grab" aria-hidden="true"></div>
  <div class="sheet-h"><h2 id="clipTitle">Kayıt hazır</h2><button class="x" type="button" data-close aria-label="Kapat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <p class="sheet-sub" id="clipInfo"></p>
  <video id="clipVideo" playsinline controls loop></video>
  <div class="clip-a">
    <button class="btn primary" id="saveBtn" type="button">Kaydet</button>
    <button class="btn" id="shareBtn" type="button">Paylaş</button>
    <button class="btn ghost" id="delBtn" type="button">Sil</button>
  </div>
</section>

<input type="file" id="fileInput" class="vh" accept="video/*" tabindex="-1" aria-hidden="true">
<input type="file" id="captureInput" class="vh" accept="video/*" capture="environment" tabindex="-1" aria-hidden="true">
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const pad2 = (n) => String(n).padStart(2, '0');
const OSDF = '"VT323", "Courier New", monospace';

const E = {
  app: $('#app'), stage: $('#stage'), lcd: $('#lcd'), gl: $('#gl'), osd: $('#osd'), power: $('#power'),
  msg: $('#msg'), msgText: $('#msgText'), msgA: $('#msgActions'),
  fmt: $('#fmtBtn'), flip: $('#flipBtn'), layers: $('#layersBtn'),
  src: $('#srcBtn'), rec: $('#recBtn'), clip: $('#clipBtn'),
  file: $('#fileInput'), capture: $('#captureInput'), cam: $('#camVideo'), fv: $('#fileVideo'),
  toast: $('#toast'), scrim: $('#scrim'),
  layersSheet: $('#layersSheet'), srcSheet: $('#srcSheet'), clipSheet: $('#clipSheet'),
  layerList: $('#layerList'), amt: $('#amt'), amtVal: $('#amtVal'),
  clipVideo: $('#clipVideo'), clipInfo: $('#clipInfo'), save: $('#saveBtn'), share: $('#shareBtn'), del: $('#delBtn'),
  tapes: Array.from(document.querySelectorAll('.tape')),
};

/* ---------- presets: every number is a physical knob, horizontal px are per 640-wide frame ---------- */
const PRESETS = {
  dv: {
    year: 2005, r43: [640, 480], r916: [360, 640], fps: 30, banner: 'DV  SP',
    sensor: { sat: 1.16, black: -0.03, knee: 0.74, contrast: 1.05, sharp: 1.0, noise: 0.02, cnoise: 0.016, smear: 0.6, bloom: 0.3, vig: 0.2, ca: 0.004,
      wb: [0.96, 1.0, 1.06], cm: [1.05, -0.03, -0.02, -0.02, 1.03, -0.01, -0.01, -0.03, 1.04] },
    tape: { inter: 1, lumaBlur: 0.5, ring: 0, chromaBlur: 1.6, chromaShift: 0.6, subH: 4, subV: 1, block: 0.012, jitter: 0, wave: 0, head: 0, drop: 0, snow: 0, tapeSat: 1.0, hue: 0, dvErr: 0.0005, track: 0 },
    ae: { strength: 0.55, k: 10, c: 5.5, min: 0.6, max: 1.9 },
    audio: { hp: 90, lp: 12000, thr: -30, ratio: 4, hiss: 0.0025, wow: 0 },
  },
  vhs: {

const HEAD = `#version 300 es
precision highp float;
precision highp sampler2D;
out vec4 outColor;
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float hash13(vec3 p3){ p3 = fract(p3 * .1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }

const SRC = `
uniform sampler2D uSrc;
uniform vec4 uCrop;

const FS_METER = HEAD + SRC + `

/* CCD vertical smear: per column, the share of near-clipped pixels becomes a full-height streak */
const FS_SMEAR = HEAD + SRC + `
uniform float uW;
uniform float uLod;
void main(){

/* sensor + camera DSP: lens, AF blur, gain, white balance, knee, saturation, detail halo, noise, smear, date burn-in */
const FS_SENSOR = HEAD + SRC + `
uniform sampler2D uSmear;
uniform sampler2D uBurn;
uniform vec2 uRes;
uniform float uLod, uFocus, uGain, uFrame;
uniform vec3 uWB;
uniform mat3 uCM;
uniform float uSat, uBlack, uKnee, uContrast, uSharp, uNoise, uCNoise, uSmearAmt, uBloom, uVig, uCA, uBurnOn;
vec3 kneeC(vec3 x, float k){
  vec3 t = clamp((x - k) / (1.0 - k), 0.0, 1.0);
  vec3 sh = k + (1.0 - k) * (t + t * t - t * t * t);
  return mix(x, sh, step(vec3(k), x));
}
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 px = 1.0 / uRes;
  float lod = uLod + uFocus;
  vec2 cc = uv - 0.5;
  float r2 = dot(cc, cc);
  float ca = uCA * r2 * 4.0;
  vec3 col;
  col.r = textureLod(uSrc, srcUV(0.5 + cc * (1.0 + ca)), lod).r;
  col.g = textureLod(uSrc, srcUV(uv), lod).g;
  col.b = textureLod(uSrc, srcUV(0.5 + cc * (1.0 - ca)), lod).b;
  if (uFocus > 0.05) {
    float rr = uFocus * 1.3;
    vec3 acc = col;
    acc += textureLod(uSrc, srcUV(uv + vec2(rr, 0.0) * px), lod).rgb;
    acc += textureLod(uSrc, srcUV(uv - vec2(rr, 0.0) * px), lod).rgb;
    acc += textureLod(uSrc, srcUV(uv + vec2(0.0, rr) * px), lod).rgb;
    acc += textureLod(uSrc, srcUV(uv - vec2(0.0, rr) * px), lod).rgb;
    col = acc / 5.0;
  }
  float d = 1.25;
  float lN = luma(textureLod(uSrc, srcUV(uv + vec2(0.0, d) * px), lod).rgb);
  float lS = luma(textureLod(uSrc, srcUV(uv - vec2(0.0, d) * px), lod).rgb);
  float lE = luma(textureLod(uSrc, srcUV(uv + vec2(d, 0.0) * px), lod).rgb);
  float lW = luma(textureLod(uSrc, srcUV(uv - vec2(d, 0.0) * px), lod).rgb);
  float hp = luma(col) - 0.25 * (lN + lS + lE + lW);

  vec3 lin = col * col;
  vec3 big = textureLod(uSrc, srcUV(uv), uLod + 3.5).rgb;
  big *= big;
  lin += max(big - 0.45, 0.0) * uBloom;
  float sm = texture(uSmear, vec2(uv.x, 0.5)).r;
  lin += vec3(1.0, 0.88, 1.0) * clamp(sm * 10.0, 0.0, 1.4) * uSmearAmt;
  lin *= uGain * uWB;
  lin *= 1.0 - uVig * smoothstep(0.08, 0.5, r2);

  vec3 g = sqrt(max(lin, 0.0));
  g = clamp(uCM * g, 0.0, 4.0);
  g = kneeC(g, uKnee);
  g = (g - 0.5) * uContrast + 0.5;
  g = uBlack >= 0.0 ? uBlack + g * (1.0 - uBlack) : max(g + uBlack, 0.0) / (1.0 + uBlack);
  float Y = luma(g);
  g = mix(vec3(Y), g, uSat);
  g += hp * uSharp * 1.7;

  float gn = max(uGain, 1.0);
  float n = hash13(vec3(gl_FragCoord.xy, uFrame)) - 0.5;
  g += n * uNoise * gn * (1.15 - 0.75 * Y) * 2.0;
  vec2 cq = floor(gl_FragCoord.xy / 2.0);
  vec2 cn = vec2(hash13(vec3(cq, uFrame + 11.0)), hash13(vec3(cq, uFrame + 23.0))) - 0.5;
  float camp = uCNoise * gn * (1.2 - Y);
  g.r += cn.x * camp * 1.4;
  g.b += cn.y * camp * 1.6;
  g.g -= (cn.x + cn.y) * camp * 0.5;

  vec4 b = texture(uBurn, uv);
  g = mix(g, b.rgb, b.a * uBurnOn);
  outColor = vec4(clamp(g, 0.0, 1.0), 1.0);
}`;

/* tape / codec: interlace weave, YIQ bandwidth, time base error, head switching, dropouts, DV/JPEG blocks */
const FS_TAPE = HEAD + `
uniform sampler2D uCur;
uniform sampler2D uPrev;
uniform vec2 uRes;
uniform float uFrame, uTime, uPx;
uniform float uInter, uFieldOrder, uLumaBlur, uRing, uChromaBlur, uChromaShift, uSubH, uSubV, uBlock;
uniform float uJitter, uWave, uHead, uDrop, uSnow, uTapeSat, uTrack, uTrackPos, uDVErr, uHue;
const mat3 RGB2YIQ = mat3(0.299, 0.596, 0.211, 0.587, -0.274, -0.523, 0.114, -0.322, 0.312);
const mat3 YIQ2RGB = mat3(1.0, 1.0, 1.0, 0.956, -0.272, -1.106, 0.621, -0.647, 1.703);
vec3 fetchRow(float x, float row){
  if (x < 0.0 || x > uRes.x) return vec3(0.02);
  vec2 uv = vec2(x / uRes.x, (row + 0.5) / uRes.y);
  if (uInter > 0.5 && mod(row + uFieldOrder, 2.0) > 0.5) return textureLod(uPrev, uv, 0.0).rgb;
  return textureLod(uCur, uv, 0.0).rgb;
}
float rowOffset(float row){
  float fromTop = uRes.y - 1.0 - row;
  float off = (hash12(vec2(row, uFrame)) - 0.5) * uJitter;
  off += (sin(row * 0.021 + uTime * 2.3) * 0.5 + sin(row * 0.0063 - uTime * 0.7)) * uWave;
  off += uWave * 5.0 * exp(-fromTop / 12.0) * sin(uTime * 1.3);
  if (row < 8.0) {
    float t = 1.0 - row / 8.0;
    off += uHead * (22.0 * t * t + (hash12(vec2(row, uFrame * 1.7)) - 0.5) * 8.0);
  }
  float band = smoothstep(0.07, 0.0, abs(row / uRes.y - uTrackPos)) * uTrack;
  off += band * (hash12(vec2(row * 0.37, uFrame)) - 0.5) * 30.0;
  return off * uPx;
}
void main(){
  float row = floor(gl_FragCoord.y);
  float x = gl_FragCoord.x + rowOffset(row);

  float sL = max(uLumaBlur, 0.05);
  float ys = 0.0, ws = 0.0;
  for (int i = -3; i <= 3; i++) {
    float fi = float(i);
    float w = exp(-fi * fi / (2.0 * sL * sL));
    ys += w * luma(fetchRow(x + fi, row));
    ws += w;
  }
  float Y = ys / ws;
  if (uRing > 0.0) {
    float yw = 0.0, ww = 0.0;
    for (int i = -2; i <= 2; i++) {
      float fx = float(i) * 2.5;
      float w = exp(-fx * fx / 18.0);
      yw += w * luma(fetchRow(x + fx, row));
      ww += w;
    }
    Y += (Y - yw / ww) * uRing;
  }

  float cx = x - uChromaShift;
  if (uSubH > 1.5) cx = (floor(cx / uSubH) + 0.5) * uSubH;
  float crow = uSubV > 1.5 ? floor(row / uSubV) * uSubV : row;
  float sC = max(uChromaBlur, 0.3);
  float stepC = max(1.0, sC / 2.0);
  vec2 IQ = vec2(0.0);
  float cw = 0.0;
  for (int i = -4; i <= 4; i++) {
    float fx = float(i) * stepC;
    float w = exp(-fx * fx / (2.0 * sC * sC));
    IQ += w * (RGB2YIQ * fetchRow(cx + fx, crow)).yz;
    cw += w;
  }
  IQ /= cw;

  if (uSnow > 0.0) {
    float cxn = x / (6.0 * uPx);
    float h0 = hash12(vec2(floor(cxn), row + mod(uFrame, 97.0) * 131.0));
    float h1 = hash12(vec2(floor(cxn) + 1.0, row + mod(uFrame, 97.0) * 131.0));
    float hn = mix(h0, h1, smoothstep(0.0, 1.0, fract(cxn))) - 0.5;
    IQ += vec2(hn, -hn * 0.7) * uSnow * 0.9;
    Y += (hash13(vec3(gl_FragCoord.xy, uFrame + 5.0)) - 0.5) * uSnow * 0.9;
  }
  if (uHue > 0.0) {
    float a = (hash12(vec2(row * 0.5, uFrame + 9.0)) - 0.5) * uHue;
    float cs = cos(a), sn = sin(a);
    IQ = vec2(IQ.x * cs - IQ.y * sn, IQ.x * sn + IQ.y * cs);
  }
  IQ *= uTapeSat;

  if (uBlock > 0.0) {
    vec2 bc = (floor(gl_FragCoord.xy / 8.0) * 8.0 + 4.0) / uRes;
    float mY = luma(textureLod(uCur, bc, 3.0).rgb);
    float q = uBlock;
    Y = mix(Y, mY, smoothstep(q * 2.5, 0.0, abs(Y - mY)) * min(uBlock * 12.0, 0.8));
    Y = mY + floor((Y - mY) / q + 0.5) * q;
  }
  if (uDrop > 0.0) {
    float hr = hash12(vec2(row, uFrame));
    if (hr > 1.0 - uDrop) {
      float st = hash12(vec2(row + 7.0, uFrame)) * uRes.x;
      float ln = (20.0 + hash12(vec2(row + 3.0, uFrame)) * 140.0) * uPx;
      float t = (gl_FragCoord.x - st) / ln;
      if (t > 0.0 && t < 1.0) { float k = (1.0 - t) * 0.9; Y = mix(Y, 0.97, k); IQ *= 1.0 - k; }
    }
  }
  if (uTrack > 0.0) {
    float band = smoothstep(0.07, 0.0, abs(row / uRes.y - uTrackPos)) * uTrack;
    float sp = step(0.985, hash13(vec3(floor(gl_FragCoord.x / (3.0 * uPx)), row, uFrame)));
    Y = mix(Y, 1.0, sp * band);
    Y += (hash13(vec3(gl_FragCoord.xy, uFrame + 1.0)) - 0.5) * band * 0.35;
  }
  vec3 rgb = YIQ2RGB * vec3(Y, IQ);
  if (uDVErr > 0.0) {
    vec2 blk = floor(gl_FragCoord.xy / vec2(16.0, 8.0));
    if (hash13(vec3(blk, floor(uFrame / 2.0))) > 1.0 - uDVErr) rgb = textureLod(uPrev, (gl_FragCoord.xy + vec2(8.0, 0.0)) / uRes, 0.0).rgb;
  }
  outColor = vec4(clamp(rgb, 0.0, 1.0), 1.0);
}`;

/* output: integer line scaling (combs stay crisp), optional CRT, clean viewfinder layer */
const FS_OUT = HEAD + `
uniform sampler2D uTape;
uniform sampler2D uOSD;
uniform vec2 uOut, uRes;
uniform float uCRT, uOSDOn;
void main(){
  vec2 uv = gl_FragCoord.xy / uOut;
  float rowF = uv.y * uRes.y;
  float row = floor(rowF);
  vec3 c = textureLod(uTape, vec2(uv.x, (row + 0.5) / uRes.y), 0.0).rgb;
  if (uCRT > 0.0) {
    float f = fract(rowF);
    float s = 0.62 + 0.38 * smoothstep(0.0, 0.35, f) * smoothstep(1.0, 0.65, f);
    c *= mix(1.0, s * 1.2, uCRT);
    float m = mod(floor(gl_FragCoord.x), 3.0);
    vec3 mask = m < 0.5 ? vec3(1.06, 0.94, 0.94) : (m < 1.5 ? vec3(0.94, 1.06, 0.94) : vec3(0.94, 0.94, 1.06));
    c *= mix(vec3(1.0), mask, uCRT);
  }
  vec4 o = textureLod(uOSD, uv, 0.0);
  c = mix(c, o.rgb, o.a * uOSDOn);
  outColor = vec4(c, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) || 'shader');
  return s;
}
let vsObj;
function program(fs) {
  const p = gl.createProgram();
  gl.attachShader(p, vsObj); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));

/* ---------- audio: highpass/lowpass, wow/flutter delay, AGC compressor, hiss ---------- */

    const v = S.source === 'cam' ? E.cam : E.fv;
    if (v.readyState >= 2 && v.videoWidth) {
      const alive = hasRVFC && now - lastRVFC < 400;
      const isNew = alive ? videoFresh : (v.currentTime !== lastVT && now - lastPoll >= 30);
      if (isNew) { videoFresh = false; lastVT = v.currentTime; lastPoll = now; el = v; w = v.videoWidth; h = v.videoHeight; }
    }
  }
  if (el) {
    fresh++;
    const div = PRESETS[S.preset].fps === 15 ? 2 : 1;
    if (fresh % div === 0) processFrame(el, w, h, now / 1000);
  }
  drawOSD(false); drawBurn(false);
  requestAnimationFrame(loop);
}

E.gl.addEventListener('webglcontextlost', (e) => { e.preventDefault(); setMsg('fatal', 'Grafik bağlamı kayboldu. Sayfayı yenile.'); });

let fontsReady = false;
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load(`40px ${OSDF}`), document.fonts.load('800 58px "Archivo"'), document.fonts.load('15px "Permanent Marker"')])
    .then(() => { fontsReady = true; drawOSD(true); drawBurn(true); }).catch(() => {});
}

E.osd.hidden = L.vfBurn;
alloc(); EFF = effective(); renderLayers(); setMsg('demo'); layout();
if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  E.power.classList.add('on'); setTimeout(() => E.power.classList.remove('on'), 1200);
}
requestAnimationFrame(loop);
window.__kaset = { get clip() { return clip ? { size: clip.blob.size, type: clip.blob.type, name: clip.name } : null; }, get state() { return { ...S, gain: brain.gain, L: brain.L, procCount }; } };
})();
</script>
